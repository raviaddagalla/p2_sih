version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chainshield_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./chainshield.db
      - DEMO_MODE=true
      - USE_REAL_PROVIDERS=false
    volumes:
      - ./backend/chainshield.db:/app/chainshield.db
      - ./backend/generated_reports:/app/generated_reports

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chainshield_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
